[theme]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EAF0F8"
textColor = "#0F172A"
font = "sans serif"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
headless = true
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"

